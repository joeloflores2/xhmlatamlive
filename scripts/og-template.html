<!doctype html>
<!-- Plantilla de la imagen social (1200×630). Regenerar: python3 scripts/generate-og.py -->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #000; color: #f4f6fa;
         font-family: 'Archivo', 'DejaVu Sans', sans-serif; position: relative; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.1) 100%); }
  svg.flight { position: absolute; inset: 0; }
  .wrap { position: absolute; inset: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .org { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
  .org span:last-child { border: 1.5px solid rgba(244,246,250,.45); padding: 4px 10px; }
  h1 { font-family: 'Archivo', 'DejaVu Sans Condensed', sans-serif; font-stretch: 62%; font-weight: 900;
       font-size: 128px; line-height: .86; text-transform: uppercase; max-width: 8.5ch; }
  .meta { display: flex; justify-content: space-between; font-size: 21px; color: #a7b0bf; font-weight: 600; letter-spacing: .04em; }
  .meta b { color: #f4f6fa; }
</style>
</head>
<body>
  <img class="bg" src="../public/images/hero/estadio-conceptual.svg" alt="">
  <div class="shade"></div>
  <svg class="flight" viewBox="0 0 1200 630" preserveAspectRatio="none">
    <path d="M 40 700 C 420 600, 720 420, 880 260 S 1120 40, 1260 -40" fill="none" stroke="#ffb020" stroke-width="12" stroke-opacity=".16" />
    <path d="M 40 700 C 420 600, 720 420, 880 260 S 1120 40, 1260 -40" fill="none" stroke="#ffb020" stroke-width="3.5" stroke-linecap="round" />
  </svg>
  <div class="wrap">
    <p class="org"><span>Halcones Xtreme México</span><span>HXM LATAM</span></p>
    <h1>Donde el talento despega</h1>
    <p class="meta"><b>hxmlatam.com</b><span>Aguascalientes, México</span></p>
  </div>
</body>
</html>
