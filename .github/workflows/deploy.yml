# Lint + tests + build en cada push y PR; publica en GitHub Pages solo desde main.
name: Build y deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # El proyecto no tiene dependencias externas; npm ci valida el lockfile.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Variables públicas: Settings → Secrets and variables → Actions → pestaña "Variables".
      # No usar secretos aquí: todo PUBLIC_* termina en el HTML público.
      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://hxmlatam.com' }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_INVESTMENT_ENDPOINT: ${{ vars.PUBLIC_INVESTMENT_ENDPOINT }}
          PUBLIC_PLAYER_ENDPOINT: ${{ vars.PUBLIC_PLAYER_ENDPOINT }}
          PUBLIC_MAP_URL: ${{ vars.PUBLIC_MAP_URL || 'https://maps.app.goo.gl/J4WKFbJHaZhM87AH6' }}

      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
